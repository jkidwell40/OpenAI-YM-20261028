name: Yang-Mills Lean bridge check

on:
  workflow_dispatch:
  push:
    paths:
      - 'MassGapBridgeSpec_v4.lean'
      - 'PhasewiseDiagonalBridge_v3.lean'
      - 'lakefile.toml'
      - 'AxiomAudit.lean'
      - 'ConstructedPhaseCollapseCorollary.lean'
      - 'PublicWitnessCorollary.lean'
      - 'SpectralEnergyBridge.lean'
      - '.github/workflows/ym-bridge-check.yml'

permissions:
  contents: read

jobs:
  bridge:
    name: Build the Bridge library and its imports
    runs-on: ubuntu-latest
    # GitHub-hosted jobs stop at 6 hours. The upstream build may need more than
    # one run; partial build products are cached between runs (see below).
    timeout-minutes: 350
    steps:
      - name: Check out the fork
        uses: actions/checkout@v4

      - name: Install the project toolchain and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false # Custom partial-build cache below

      - name: Restore partial project build from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: ym-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.run_id }}
          restore-keys: ym-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Build Bridge (v4 first, then v3, via Lake's import graph)
        run: |
          set -o pipefail
          timeout 20000 lake build Bridge 2>&1 | tee ym-build.log

      - name: Axiom audit (runs only if the build succeeded)
        run: |
          set -o pipefail
          lake env lean AxiomAudit.lean 2>&1 | tee ym-axioms.log

      - name: Compile and audit the new constructed-hierarchy corollary
        run: |
          set -o pipefail
          lake env lean ConstructedPhaseCollapseCorollary.lean 2>&1 | tee ym-corollary.log

      - name: Build the upstream public construction (Construction.lean)
        run: |
          set -o pipefail
          timeout 18000 lake build Construction 2>&1 | tee ym-construction.log

      - name: Compile and audit the public-witness corollary
        run: |
          set -o pipefail
          lake env lean PublicWitnessCorollary.lean 2>&1 | tee ym-public-witness.log

      - name: Compile and audit the spectral energy bridge (Track A)
        run: |
          set -o pipefail
          lake env lean SpectralEnergyBridge.lean 2>&1 | tee ym-spectral-energy.log

      - name: Save partial build even if the step above failed or timed out
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: ym-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.run_id }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-bridge-lean-logs
          path: ym-*.log
          if-no-files-found: warn
          retention-days: 14
